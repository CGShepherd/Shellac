run07_output_model:
  controlled_vendor_model: THAT1646 Rev02 manufacturer macro
  integrated_vendor_macro_status: OPERATING_POINT_COMPOSITION_NONCONVERGENCE_CONFIRMED
  discriminator:
    script: simulation/scripts/ae070_model_composition_discriminator.py
    result: simulation/results/run07_end_to_end/ae070_model_composition_discriminator.json
    qualification_semantics: CONTROLLED_REPRODUCIBLE_MODEL_COMPOSITION_DIAGNOSTIC
    expected:
      output_pair_only: PASS
      dual_upstream_no_that: PASS
      dual_full_ideal_output: PASS
      dual_full_vendor_that: TIMEOUT
  interpretation: >
    The vendor THAT1646 macro and the upstream chain each solve independently,
    while their integrated composition does not reproducibly reach an operating
    point. RUN07 therefore uses a controlled qualification-only small-signal
    AC surrogate correlated against AE-069 vendor-macro AC evidence. This is a
    model-composition limitation, not evidence of a hardware instability.
  surrogate:
    file: simulation/models/qualification/sch108_ae070_ac_surrogate.lib
    subckt: AE070_SCH108_AC_SURROGATE
    input_impedance_ohm: 5000
    open_circuit_differential_gain_linear_fit: 1.98791389931215
    fitted_internal_resistance_per_leg_ohm: 24.8457461554223
    fitted_resistance_semantics: AE069_SMALL_SIGNAL_AC_LOAD_RESPONSE_FIT_NOT_HARDWARE_SPECIFICATION
    correlation_source: simulation/results/run06_output/ae069_run06.json
    correlation_tolerance_db_max: 0.005
  phase_correlation:
    required_before_governance: true
    method: OUTPUT_ONLY_VENDOR_MACRO_VS_SURROGATE
    frequencies_hz: [20, 1000, 20000]
    max_abs_delta_deg: 1.0
    result: simulation/results/run07_end_to_end/ae070_output_phase_correlation.json
    interpretation: >
      RUN07's qualification-only surrogate is intentionally not phase authority
      for the THAT1646. The isolated vendor macro is therefore compared with the
      surrogate under the same 20k load, 500 pF/leg cable and both ferrite
      brackets. The measured vendor-minus-surrogate phase is retained as
      supporting evidence; phase is informative in RUN07 rather than a separate
      AE-049 pass/fail product criterion.
  supported_claims:
    - nominal_small_signal_end_to_end_ac_transfer
    - nominal_1khz_node_levels
    - THAT1646_input_loading_in_run07
    - balanced_output_load_response_correlated_to_ae069
  excluded_claims:
    - dc_offset_or_output_common_mode_accuracy
    - transient_or_capacitive_load_stability
    - distortion_or_dynamic_thd
    - clipping_overload_or_recovery
    - switching_transients
    - phantom_or_fault_survival
