vendor_macro_limitation:
  status: PERIODIC_LARGE_SIGNAL_CONVERGENCE_LIMIT_CONFIRMED
  controlled_model: THAT1646 Rev02 manufacturer macro
  evidence_date: "2026-09-15"
  observed:
    minimal_periodic_0p321vrms_10k:
      completed: true
      output_rms_v: 0.634959869
      gain_linear: 1.97806813
    minimal_periodic_3p21vrms_10k:
      completed: false
      failure: TIMEOUT_AT_ZERO_CROSSING_TOLERANCE_COLLAPSE
    gear_periodic_3p21vrms_10k:
      completed: false
      failure: TIMEOUT_AT_ZERO_CROSSING_TOLERANCE_COLLAPSE
    minimal_dc_transfer_10k:
      input_plus_3p21_v_output_v: 6.36930322
      input_minus_3p21_v_output_v: -6.37721850
      input_plus_5_v_output_v: 9.92324018
      input_minus_5_v_output_v: -9.93115520
      max_output_v_over_plusminus9v_input_sweep: 17.8649979
      min_output_v_over_plusminus9v_input_sweep: -17.8729143
  disposition: >
    Do not treat periodic large-signal timeout as hardware overload. Use the
    controlled macro for AC and operating point. Fast load/capacitance transient
    results are diagnostic/supportive only where they converge reproducibly.
    Quasi-static nonlinear transfer is used only through 5 Vrms input; 7.5 and
    9 Vrms points produced non-physical output beyond the +/-18 V rails and are
    excluded. Any quasi-static distortion result is an engineering estimate,
    not transient 1 kHz THD, and requires bench correlation before release.

stability_model_limitation:
  status: TRANSIENT_SOLVER_NONREPRODUCIBILITY_CONFIRMED
  exact_case: BLM21PG221SN1 / 100k / 10mV / 50ns / 2nF+100pF_per_leg / S1G
  evidence:
    exact_electrical_deck_completed_once:
      overshoot_percent: 23.7979
      late_residual_fraction: 1.758e-6
    same_electrical_deck_timed_out_on_other_runs: true
    solver_reproducibility:
      normal_threads_1: 0_of_3_completed
      alternate_threads_1: 0_of_3_completed
    small_signal_matrix_without_exact_rfi_clamp_additions:
      all_10mV_cases_completed: true
      late_residual_fraction_range: [1.617e-6, 1.736e-6]
      low_60ohm_overshoot_percent_range: [8.802, 9.794]
      high_220ohm_overshoot_percent_range: [20.826, 24.627]
  disposition: >
    Do not use retry-until-pass logic. Do not claim reproducible transient
    stability qualification from this combined vendor-model stack. Preserve
    the converged transient results as supportive evidence only; use exact-
    topology official-Murata small-signal AC evidence plus mandatory prototype
    load/cable stability bench verification for the qualification boundary.

