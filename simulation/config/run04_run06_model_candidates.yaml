    RUN06 requires frequency-dependent connector/output isolation behaviour;
    AE-065 used a 0.05 ohm DC equivalent only.
  candidates:
    - manufacturer: Murata
      mpn: BLM21PG600SN1D
      package: 2012_0805
      impedance_100mhz_ohm: 60
      dc_resistance_max_ohm: 0.020
      rated_current_ma: 3500
      manufacturer_simulation_range: 1MHz_to_3GHz
      source: https://www.murata.com/-/media/webrenewal/tool/library/common-pdf/static-model/component-list-fb-s-2602.ashx
      status: CANDIDATE_LOW_IMPEDANCE_BRACKET
    - manufacturer: Murata
      mpn: BLM21PG221SN1D
      package: 2012_0805
      impedance_100mhz_ohm: 220
      dc_resistance_max_ohm: 0.045
      rated_current_ma: 2000
      manufacturer_simulation_range: 1MHz_to_3GHz
