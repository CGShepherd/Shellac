schema_version: 1
project: shellac
introduced_by: G3-027
status: CONTROLLED_CANDIDATE
currency: GBP
tax_basis: ex_VAT
objective: minimise_landed_bom_cost_subject_to_foundry
rules:
  - hard_engineering_requirements_precede_cost
  - authorised_distribution_preferred_for_safety_and_signal_critical_parts
  - compare_extended_line_cost_not_unit_price
  - buy_required_switch_quantity_only_unless_supply_risk_or_engineering_case_justifies_spares
  - evaluate_sensible_spares_only_for_low_cost_or_damage_prone_parts
  - include_shipping_handling_supplier_direct_surcharges
  - prefer_supplier_consolidation_when_landed_cost_falls
  - never_buy_surplus_only_to_cross_free_shipping_or_price_break_unless_landed_cost_falls
  - record_quote_date_stock_lifecycle_and_price_break
  - procurement_never_overrides_frozen_mpn_without_controlled_ECO
primary_pool: [DigiKey_UK, Mouser_UK, Farnell_UK, CPC_UK]
challenger_pool: [RS_UK, TME, LCSC]
switch_spare_policy:
  default_spares: 0
  require_active_or_recommended_for_new_designs: true
  reopen_if: [NRND, EOL, obsolete, material_supply_risk]
shipping_snapshot_2026_08_24:
  DigiKey_UK: {status: VERIFY_AT_CHECKOUT}
  Mouser_UK: {free_shipping_gbp: 65}
  Farnell_UK: {free_standard_shipping_gbp: 40, under_threshold_gbp: 8.99}
  CPC_UK: {free_standard_shipping_gbp_ex_vat: 24.99}
