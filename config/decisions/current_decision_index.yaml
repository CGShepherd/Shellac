  AE-041-A1:
    title: 3P4T matrix and top-cover control authority
    status: CURRENT_ARCHITECTURE_QUALIFICATION_OPEN
    primary_record: docs/design_pack/AE-041_3P4T_Matrix_and_Top_Cover_Control_Authority_Rev_A1.md
    evidence:
      - generator/model/control_architecture.py
      - generator/model/controls.py
      - config/bom/shellac_bom.yaml
      - docs/design_pack/AE-046_SCH105_Mode_Matrix_Pre-SPICE_Review_Rev_A0.md
      - docs/design_pack/AE-068_RUN05_SCH104_SCH105_Matrix_Evidence_Rev_A0.md
    implementation:
      eq_controls: Four independent NKK NR01-family 5-position BBM controls; exact production suffix remains open.
      channel_matrix: C&K A30403RNCB 3P4T BBM gold THT preferred; TE/Alcoswitch MRJE3404 fallback.
      mute_rumble: C&K 7201SYCBE.
      note: AE-068 qualifies RUN05 steady-state routing, insertion, mono weighting and crosstalk. RUN12 BBM transient qualification, exact production-switch continuity/detent mapping, mechanical coordinates, parasitic bench correlation and final procurement choice remain open.
