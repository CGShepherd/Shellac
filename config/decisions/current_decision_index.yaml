    supersedes:
      - G3-025 optional-3180 active architecture
      - G3-026 optional-3180 implementation
      - G3-027 resynthesis requirement
  DR-038:
    title: SCH101 precision architecture
    status: CURRENT_SELECTED_PENDING_IMPLEMENTATION
    primary_record: docs/decisions/DR-038_SCH101_Precision_Architecture_SELECTED.md
    proposal_record: docs/decisions/DR-038_SCH101_Precision_Architecture_PROPOSED.md
    evidence:
      - docs/AE-013_SCH101_Noise_CMRR_Review_Rev_A0.md
      - docs/AE-014_SCH101_Precision_Architecture_Downselect_Rev_A0.md
      - docs/AE-018_Live_Dependency_Disposition_and_Precision_CAD_Primitives_Rev_A0.md
      - docs/design_pack/AE-042_SCH101_Pre-SPICE_Interim_Design_Authority_Rev_A0.md
    implementation:
      converter_gain: 4.0
      network: LT5400-7 A-grade retained provisionally pending full tolerance/value review
      gain_selection: fail-safe removable gold service-shunt topology, approximately 14/18/22 dB; no-shunt state is 18 dB
      note: Core LT5400 precision architecture remains current. The older service-link gain implementation in the live generator is superseded by AE-042 and requires controlled implementation after SPICE/configuration review.
  DR-039:
    title: State-independent post-EQ DC blocking
    status: CURRENT_SELECTED_PENDING_IMPLEMENTATION
    primary_record: docs/decisions/DR-039_Branch_Local_DC_Block_SELECTED.md
    historical_record: docs/decisions/DR-039_Common_Post_EQ_DC_Block_SELECTED.md
    proposal_record: docs/decisions/DR-039_Common_Post_EQ_DC_Block_PROPOSED.md
    evidence:
      - docs/AE-015_Full_Chain_Noise_DC_Review_Rev_A0.md
      - docs/AE-018_Live_Dependency_Disposition_and_Precision_CAD_Primitives_Rev_A0.md
      - docs/design_pack/AE-044_DR039_SCH107_Coupled_Pre-SPICE_Review_Rev_A0.md
      - docs/design_pack/AE-049_Shellac_SPICE_Numerical_Acceptance_Criteria_Rev_A0.md
      - docs/design_pack/AE-052_DR039_SCH107_Pre-SPICE_Architectural_Downselect_Rev_A0.md
      - docs/design_pack/AE-067_RUN04_DR039_SCH107_LF_Trade_Evidence_Rev_A0.md
    implementation: >
      AE-067 selects branch-local DC blocking for controlled implementation: retain the 1 uF / 330 kOhm
      network only in the direct bypass branch while the existing SCH107 high-pass branch provides
      intrinsic DC blocking. RUN04 rejects the loaded common pre-split topology, the post-switch common
      block on charge-transient grounds, and the x10 impedance-scaled alternative on
      LF/noise/value-engineering grounds. The selected topology is not yet migrated into the live product
      generator; RUN09, RUN10, RUN12 and bench correlation remain open before manufacturing baseline.
  DR-040:
    title: Precision CAD primitive staging rule
    status: CURRENT_IMPLEMENTED
    primary_record: docs/decisions/DR-040_Precision_CAD_Primitive_Staging_SELECTED.md
    evidence:
